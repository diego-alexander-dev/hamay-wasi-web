# =================================================================
# Configuracion del Servidor Web
# =================================================================
server.port=${PORT:8080}
server.error.include-message=never

# =================================================================
# Conexion a Base de Datos PostgreSQL
# =================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hamay_wasi_avanzada}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# =================================================================
# Configuracion de JPA e Hibernate
# =================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# =================================================================
# Motor de Plantillas Thymeleaf
# =================================================================
spring.thymeleaf.cache=false

# =================================================================
# Niveles de Logging
# =================================================================
logging.level.org.hibernate.SQL=warn
logging.level.com.hamaywasi=info

# =================================================================
# WhatsApp Business API (Notificaciones al cliente)
# =================================================================
whatsapp.api.enabled=true
whatsapp.api.url=https://graph.facebook.com/v20.0
whatsapp.api.phone-number-id=100609346426371
whatsapp.api.access-token=SANDBOX_TOKEN